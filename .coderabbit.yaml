reviews:
  # more strict review profile
  profile: "assertive"

  # put high level summary in its own comment
  # instead of editing your pr description
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_placeholder: ""

  # also never auto edit titles
  auto_title_placeholder: ""

  # the pr-review channel takes care of this
  suggested_reviewers: false

  # rust and python, no docstring coverage gate
  pre_merge_checks:
    docstrings:
      mode: "off"

  # and disable the docstring generation checkbox
  finishing_touches:
    docstrings:
      enabled: false

  path_instructions:
    - path: "**"
      instructions: |
        Do not comment about failing CI, it's already clear and visible.

  # auto review new commits
  # auto review draft PRs
  # auto review against any base branch
  # don't pause reviews on active PRs (default pauses after 5 commits)
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - ".*"

  # approve a pull request rated minimal risk, unless it touches a path that
  # always needs a person
  # authors can't approve their own pull request with `@coderabbitai approve`
  # the paths mirror the "Oxen merge requirements" rulesets on this repository,
  # which are what enforce the human review, so change both together
  auto_approvals:
    enabled: true
    max_merge_risk: minimal
    allow_author_approval: false
    overrides:
      - enabled: false
        paths:
          - ".coderabbit.yaml"
          - "crates/liboxen/**/*merkle*"
          - "crates/liboxen/**/*merkle*/**"
          - "crates/liboxen/src/util/hasher.rs"
          - "crates/liboxen/src/core/db/**"
          - "crates/liboxen/src/core/repo_locks.rs"
          - "crates/liboxen/src/storage/**"
          - "crates/liboxen/src/util/fs/atomic_file.rs"
          - "crates/**/migrations.rs"
          - "crates/liboxen/src/command/migrate/**"
          - "crates/liboxen/src/repositories/placement.rs"
          - "crates/oxen-server/src/middleware.rs"
          - "crates/oxen-server/src/routes.rs"
          - "crates/oxen-server/src/tasks.rs"

name: Remove other Rust toolchains
description: >
  Uninstall every Rust toolchain except the one rust-toolchain.toml selects, and make that one the
  default. Swatinem/rust-cache hashes every installed toolchain into its cache key, so a toolchain
  the runner image preinstalls would otherwise tie the cache to the image version. Run it after
  setup-rust-toolchain and before rust-cache. Requires the repository to be checked out first.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        active="$(rustup show active-toolchain | tr -d '\r' | cut -d' ' -f1)"
        test -n "$active"
        rustup default "$active"
        for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
          if [ "$toolchain" != "$active" ]; then
            rustup toolchain uninstall "$toolchain"
          fi
        done
        rustup toolchain list

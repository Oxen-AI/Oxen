name: 🐳 Build branch for docker

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to build. Also accepts commit sha and tag name."
        required: true
        type: string
      ARCHITECTURE:
        description: "The architecture to build for. Either amd64 (for x86_64) or arm64."
        required: false
        default: "arm64"
        type: string
    secrets:
      GH_PERSONAL_ACCESS_TOKEN:
        description: "GitHub personal access token"
        required: true

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build. Also accepts commit sha and tag name."
        required: true
      ARCHITECTURE:
        description: "The architecture to build for. Either amd64 (for x86_64) or arm64."
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - amd64

env:
  AWS_REGION: us-west-1
  AWS_ROLE: ${{ vars.EC2_GITHUB_RUNNER_ROLE }}
  # Lowercase: registry paths are case-sensitive and the owner name is not.
  REGISTRY_IMAGE: ghcr.io/oxen-ai/oxen-server

# Each job below states what it needs; a job's own block replaces this one rather
# than adding to it, so nothing inherits a write it has no use for.
permissions:
  contents: read

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  start-self-hosted-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    # Assumes an AWS role by OIDC. Checks nothing out.
    permissions:
      id-token: write
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-duration-seconds: 900
          aws-region: ${{ env.AWS_REGION }}

      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ${{ vars.EC2_IMAGE_ID }}
          ec2-instance-type: m7g.4xlarge
          subnet-id: ${{ vars.SUBNET_ID }}
          security-group-id: ${{ vars.SECURITY_GROUP_ID }}
          aws-resource-tags: >
            [
              {"Key": "Name", "Value": "ec2-github-runner"}
            ]

  release_docker:
    needs: start-self-hosted-runner
    runs-on: ${{ needs.start-self-hosted-runner.outputs.label }}
    # Reads the source it builds. Publishes nothing: the artifact this uploads is a
    # timing report, and no image leaves the runner.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.branch }}

      # Two cold compiles of the same source, differing only in the release
      # profile's LTO and codegen-unit settings, so the pair prices what those two
      # settings cost. `--target builder` stops before the runtime stage: this
      # measures the compile and assembles no deployable image.
      #
      # The second build reuses the cached apt and FFmpeg layers but recompiles
      # from scratch, because changing the profile invalidates every layer from the
      # ENV that carries it onward. Each step's own duration is the headline
      # number; the reports below say where the time went inside it.
      - name: Baseline build (fat LTO, one codegen unit)
        run: |
          docker build --target builder -t timings-baseline \
            --platform linux/${{ inputs.ARCHITECTURE }} .

      - name: Comparison build (thin LTO, 16 codegen units)
        run: |
          docker build --target builder -t timings-thin \
            --build-arg CARGO_PROFILE_RELEASE_LTO=thin \
            --build-arg CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 \
            --platform linux/${{ inputs.ARCHITECTURE }} .

      # Cargo writes the reports inside the build, so they come out of the image
      # rather than the workspace.
      - name: Extract the timing reports
        run: |
          for variant in baseline thin; do
            id=$(docker create "timings-$variant")
            docker cp "$id:/usr/src/oxen-server/target/cargo-timings" "timings-$variant"
            docker rm "$id"
          done

      - name: Upload the timing reports
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ inputs.ARCHITECTURE }}
          path: timings-*/
          retention-days: 7

  stop-self-hosted-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-self-hosted-runner
      - release_docker
    runs-on: ubuntu-latest
    if: ${{ always() }}
    # Assumes an AWS role by OIDC. Checks nothing out.
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-duration-seconds: 900
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-self-hosted-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-self-hosted-runner.outputs.ec2-instance-id }}

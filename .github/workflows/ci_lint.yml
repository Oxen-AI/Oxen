name: 🐂🔎 Continuous integration - Lint

on:
  workflow_call:

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  check:
    name: Cargo check, format, clippy + Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changes
        id: changes
        uses: ./.github/actions/classify-changes
        with:
          job: lint

      - name: Setup Rust Toolchain
        if: steps.changes.outputs.code == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy, rustfmt
          cache: false # .github/actions/rust-cache caches below, with save-if control.

      - name: Remove other Rust toolchains
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/remove-other-rust-toolchains

      # Must precede the tool versions load: rust-cache hashes every CARGO*/RUST* environment
      # variable into its key, so the cargo-tool pins in tool-versions.env would otherwise bust
      # the whole build cache every time one of them is bumped.
      - name: Cache Rust dependencies
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/rust-cache
        with:
          prefix-key: rust-lint
          # Only cache builds from main. Otherwise our caches will be too big and start to churn
          # (the repository's cache limit is 30 GB). Other branches will still use the cache but
          # won't save it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Load tool versions
        if: steps.changes.outputs.code == 'true' || github.event_name == 'pull_request'
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"

      - name: Install uv
        if: steps.changes.outputs.code == 'true' || github.event_name == 'pull_request'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      # The rust-cache step above leaves ~/.cargo/bin out (cache-bin in .github/actions/rust-cache),
      # so without this every run builds cargo-sort from source. install-prereqs reads the installed
      # version from .crates.toml, and reinstalls without it.
      - name: Cache cargo-sort
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-sort
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-sort-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_SORT_VERSION }}

      - name: Install dependencies and development tools
        if: steps.changes.outputs.code == 'true'
        run: |
          cd ${{ github.workspace }}
          ./bin/install-prereqs --ci

      - name: Run Pre-Commit Hooks
        if: steps.changes.outputs.code == 'true'
        run: |
          cd ${{ github.workspace }}
          if ! pre-commit run --color=always --verbose --all-files ; then
            echo "Pre-commit failed. Showing git status:"
            git -c color.status=always status
            exit 1
          fi

      # A change to Markdown alone needs only the one hook that checks it.
      - name: Check trailing whitespace
        if: steps.changes.outputs.code != 'true' && github.event_name == 'pull_request'
        run: uvx pre-commit run --color=always trailing-whitespace --all-files

      - name: Record the pass
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/record-pass
        with:
          name: ${{ steps.changes.outputs.pass-record }}

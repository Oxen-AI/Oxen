name: 🚀🐧 Release Linux

on:
  workflow_call:
    inputs:
      ARCHITECTURE:
        description: "The architecture to build for"
        required: true
        default: "x86_64"
        type: string
      AWS_ROLE:
        description: "AWS role to assume"
        required: true
        type: string
      AWS_REGION:
        description: "AWS region"
        required: true
        type: string
      PYTHON_VERSIONS:
        description: "Python versions to build"
        required: true
        type: string
      RELEASE_VERSION:
        description: "Release version"
        required: true
        type: string
      # Removal is scheduled for 2029-05-31, RHEL 8 end of maintenance. See docs/deprecations.md.
      RHEL8:
        description: "Build in the manylinux_2_28 container, for artifacts that run on glibc 2.28"
        required: false
        default: false
        type: boolean
    secrets:
      GH_PERSONAL_ACCESS_TOKEN:
        description: "GitHub personal access token"
        required: true

defaults:
  run:
    shell: bash -leo pipefail {0}

env:
  EC2_IMAGE_ID_X86_64: ami-0823857dea006a2fa
  EC2_IMAGE_ID_ARM64: ami-05fa76c95fcf3d338
  EC2_INSTANCE_TYPE_X86_64: m7i.4xlarge
  EC2_INSTANCE_TYPE_ARM64: m7g.4xlarge

jobs:
  start-self-hosted-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.AWS_ROLE }}
          role-duration-seconds: 900
          aws-region: ${{ inputs.AWS_REGION }}

      - name: Set image and instance type
        run: |
          if [ "${{ inputs.ARCHITECTURE }}" = "arm64" ]; then
            echo "EC2_IMAGE_ID=${{ env.EC2_IMAGE_ID_ARM64 }}" >> $GITHUB_ENV
            echo "EC2_INSTANCE_TYPE=${{ env.EC2_INSTANCE_TYPE_ARM64 }}" >> $GITHUB_ENV
          else
            echo "EC2_IMAGE_ID=${{ env.EC2_IMAGE_ID_X86_64 }}" >> $GITHUB_ENV
            echo "EC2_INSTANCE_TYPE=${{ env.EC2_INSTANCE_TYPE_X86_64 }}" >> $GITHUB_ENV
          fi

      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ${{ env.EC2_IMAGE_ID }}
          ec2-instance-type: ${{ env.EC2_INSTANCE_TYPE }}
          subnet-id: subnet-0e28805edbdad482f
          security-group-id: sg-09c8aa5830122d671
          iam-role-name: github-runner-instance-profile
          aws-resource-tags: >
            [
              {"Key": "Name", "Value": "ec2-github-runner"}
            ]

  release_linux:
    name: Build Oxen CLI, Server, and Python wheels
    needs: start-self-hosted-runner
    runs-on: ${{ needs.start-self-hosted-runner.outputs.label }}

    env:
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_BUCKET: oxen-release-build-cache
      SCCACHE_REGION: us-west-1
      CARGO_INCREMENTAL: "0"
      # Empty on the glibc 2.34 build, whose artifact names are the ones the install
      # instructions and the OxenHub and oxen-infra CI jobs download.
      ARTIFACT_SUFFIX: ${{ inputs.RHEL8 && '-rhel8' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create release directory
        run: mkdir ${{ github.workspace }}/release

      - name: Install rustup
        if: ${{ !inputs.RHEL8 }}
        run: |
          echo "export HOME=/root" >> /root/.bashrc
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Install system dependencies
        if: ${{ !inputs.RHEL8 }}
        run: |
          dnf group install "Development Tools" -y
          dnf install -y \
            openssl-devel \
            cmake \
            clang \
            rubygems \
            pkg-config

      - name: Load tool versions
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"

      - name: Install uv
        if: ${{ !inputs.RHEL8 }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build oxen binaries
        if: ${{ !inputs.RHEL8 }}
        run: |
          cargo build --workspace --exclude oxen-py --release

      - name: Build Python wheels
        if: ${{ !inputs.RHEL8 }}
        run: |
          uv python install ${{ inputs.PYTHON_VERSIONS }}

          cd ${{ github.workspace }}/oxen-python

          for version in ${{ inputs.PYTHON_VERSIONS }}; do
            uvx --from "maturin[patchelf]==${{ env.MATURIN_VERSION }}" maturin build --release --interpreter /root/.local/bin/python${version}
          done

      - name: sccache stats
        if: ${{ always() && !inputs.RHEL8 }}
        run: sccache --show-stats

      - name: Build oxen binaries and Python wheels against glibc 2.28
        if: ${{ inputs.RHEL8 }}
        env:
          MANYLINUX_ARCH: ${{ inputs.ARCHITECTURE == 'arm64' && 'aarch64' || 'x86_64' }}
        run: |
          # sccache is a static musl binary, so the runner's copy also runs under the container's
          # older glibc. It reads the credentials for its S3 bucket from the instance metadata
          # service, which the container reaches only on the host network. That network also shares
          # the runner's loopback, so the container's sccache takes a port of its own instead of
          # attaching to a server outside the container. Its cache entries live under their own
          # key prefix, apart from those of the glibc 2.34 build.
          sccache_bin="$(command -v sccache)"
          docker run --rm \
            --network host \
            --workdir /io \
            --volume "${{ github.workspace }}:/io" \
            --volume "$sccache_bin:/usr/local/bin/sccache:ro" \
            --env PYTHON_VERSIONS="${{ inputs.PYTHON_VERSIONS }}" \
            --env RUSTC_WRAPPER \
            --env CMAKE_C_COMPILER_LAUNCHER \
            --env CMAKE_CXX_COMPILER_LAUNCHER \
            --env SCCACHE_BUCKET \
            --env SCCACHE_REGION \
            --env SCCACHE_SERVER_PORT=4227 \
            --env SCCACHE_S3_KEY_PREFIX=rhel8/ \
            --env CARGO_INCREMENTAL \
            "quay.io/pypa/manylinux_2_28_${MANYLINUX_ARCH}:${{ env.MANYLINUX_VERSION }}" \
            bin/build-rhel8-release

      - name: Create tarballs with oxen binaries
        run: |
          tar -czvf ${{ github.workspace }}/release/oxen-linux-${{ inputs.ARCHITECTURE }}${{ env.ARTIFACT_SUFFIX }}.tar.gz -C ${{ github.workspace }}/target/release/ oxen
          tar -czvf ${{ github.workspace }}/release/oxen-server-linux-${{ inputs.ARCHITECTURE }}${{ env.ARTIFACT_SUFFIX }}.tar.gz -C ${{ github.workspace }}/target/release/ oxen-server

      - name: Create tarballs with Python wheels
        run: |
          tar -czvf ${{ github.workspace }}/release/oxen-wheels-linux-${{ inputs.ARCHITECTURE }}${{ env.ARTIFACT_SUFFIX }}.tar.gz -C ${{ github.workspace }}/target/wheels/ .

      - name: Create deb packages
        if: ${{ !inputs.RHEL8 }}
        run: |
          gem install fpm

          fpm \
            -s dir -t deb \
            -p ${{ github.workspace }}/release/oxen-linux-${{ inputs.ARCHITECTURE }}.deb \
            -C ${{ github.workspace }}/target/release \
            --name oxen \
            --version ${{ inputs.RELEASE_VERSION }} \
            --architecture all \
            --description "Oxen is a command line tool to version and manage large machine learning datasets" \
            --url "https://oxen.ai" \
            --maintainer "OxenAI hello@oxen.ai" \
            oxen=/usr/bin/oxen

          fpm \
            -s dir -t deb \
            -p ${{ github.workspace }}/release/oxen-server-linux-${{ inputs.ARCHITECTURE }}.deb \
            -C ${{ github.workspace }}/target/release \
            --name oxen-server \
            --version ${{ inputs.RELEASE_VERSION }} \
            --architecture all \
            --description "oxen-server is the server for oxen to version and manage large machine learning datasets" \
            --url "https://oxen.ai" \
            --maintainer "OxenAI hello@oxen.ai" \
            oxen-server=/usr/bin/oxen-server

      - name: Create tarball with all artifacts
        run: |
          tar -czvf ${{ github.workspace }}/oxen-linux-${{ inputs.ARCHITECTURE }}${{ env.ARTIFACT_SUFFIX }}-release.tar.gz -C ${{ github.workspace }}/release/ .

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oxen-linux-release-${{ inputs.ARCHITECTURE }}${{ env.ARTIFACT_SUFFIX }}.tar.gz
          path: ${{ github.workspace }}/oxen-linux-${{ inputs.ARCHITECTURE }}${{ env.ARTIFACT_SUFFIX }}-release.tar.gz
          retention-days: 1

  stop-self-hosted-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-self-hosted-runner
      - release_linux
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.AWS_ROLE }}
          role-duration-seconds: 900
          aws-region: ${{ inputs.AWS_REGION }}

      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-self-hosted-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-self-hosted-runner.outputs.ec2-instance-id }}

name: 🚀🍏 Release MacOS

on:
  workflow_call:
    inputs:
      PYTHON_VERSIONS:
        description: "Python versions to build"
        required: true
        type: string
      AWS_ROLE:
        description: "AWS role to assume"
        required: true
        type: string
      AWS_REGION:
        description: "AWS region"
        required: true
        type: string

env:
  MACOSX_DEPLOYMENT_TARGET: 10.13
  # liblzma-sys links whatever xz pkg-config finds unless this is set, which on the arm64 runner is
  # Homebrew's, so the released oxen and oxen-server would fail to start on a Mac without it.
  LZMA_API_STATIC: "1"

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  release_macos:
    name: Release Oxen MacOS (${{ matrix.arch }})
    runs-on: macos-15-xlarge
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    env:
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_BUCKET: oxen-release-build-cache
      SCCACHE_REGION: us-west-1
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.AWS_ROLE }}
          role-duration-seconds: 3600
          aws-region: ${{ inputs.AWS_REGION }}

      - name: Create release directory
        run: mkdir ${{ github.workspace }}/release

      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Load tool versions
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build oxen binaries
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --workspace --exclude oxen-py --release --target ${{ matrix.target }}

      - name: Build Python wheels
        run: |
          uv python install ${{ inputs.PYTHON_VERSIONS }}

          cd ${{ github.workspace }}/oxen-python

          for version in ${{ inputs.PYTHON_VERSIONS }}; do
            uvx maturin build --release --interpreter /Users/runner/.local/bin/python${version} --target ${{ matrix.target }}
          done

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Create tarballs with oxen binaries
        run: |
          tar -czvf ${{ github.workspace }}/release/oxen-macos-${{ matrix.arch }}.tar.gz -C ${{ github.workspace }}/target/${{ matrix.target }}/release/ oxen
          tar -czvf ${{ github.workspace }}/release/oxen-server-macos-${{ matrix.arch }}.tar.gz -C ${{ github.workspace }}/target/${{ matrix.target }}/release/ oxen-server

      - name: Create tarball with Python wheels
        run: |
          cd ${{ github.workspace }}/target/wheels/

          tar -czvf ${{ github.workspace }}/release/oxen-wheels-macos-${{ matrix.arch }}.tar.gz ./*.whl

      - name: Create tarball with all artifacts
        run: |
          tar -czvf ${{ github.workspace }}/oxen-macos-${{ matrix.arch }}-release.tar.gz -C ${{ github.workspace }}/release/ .

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oxen-macos-${{ matrix.arch }}-release.tar.gz
          path: ${{ github.workspace }}/oxen-macos-${{ matrix.arch }}-release.tar.gz
          retention-days: 1

[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/data", "experiments/*"]

[workspace.package]
version = "0.56.0"
edition = "2024"
license-file = "LICENSE"
homepage = "https://oxen.ai"
repository = "https://github.com/Oxen-AI/Oxen"
readme = "README.md"
rust-version = "1.97.1"

[workspace.lints.clippy]
disallowed-methods = "deny"

[workspace.lints.rust]
# Allows the expected macOS "__eh_frame section too large" note from the
# bundled DuckDB/RocksDB (slower unwind lookups; harmless). Never silence it
# with -Wl,-no_compact_unwind instead — that turned every DuckDB error into a
# `libc++abi: terminating due to uncaught exception` SIGABRT of the whole
# server (see .cargo/config.toml).
linker_messages = "allow"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
actix-files = "0.6.2"
actix-http = "3.4.0"
actix-multipart = "0.8"
actix-multipart-test = "0.0.3"
actix-web = { version = "4.9.0", features = ["rustls"] }
actix-web-httpauth = "0.8.0"
anyhow = "1.0.102"
approx = "0.5.1"
arrow = "=58.1.0"
astral-tokio-tar = "0.6"
async-compression = { version = "0.4.2", features = ["tokio", "gzip", "futures-io"] }
async-recursion = "1.1.1"
async-std = { version = "1.12.0", features = ["unstable"] }
async-tar = "0.6"
async-tempfile = "0.8"
async-trait = "0.1.80"
async-walkdir = "2.1.0"
async_zip = { version = "0.0.18", features = ["full"] }
aws-config = "1.10.1"
aws-sdk-s3 = "1.141.0"
aws-smithy-runtime-api = "1.14.0"
bytecount = "0.6.3"
bytes = "1.5.0"
bytesize = "2.7"
bytevec = "0.2.0"
chrono = "0.4.30"
clap = { version = "4.4.2", features = ["cargo", "derive"] }
colored = "3.1"
comfy-table = "8.0"
console-subscriber = "0.4.1"
criterion = { version = "5.0.1", package = "codspeed-criterion-compat", features = ["async_tokio"] }
deadqueue = "0.2.4"
derive_more = { version = "2.1", features = ["full"] }
dialoguer = "0.12"
difference = "2.0.0"
dirs = "6.0"
dotenvy = "0.15.7"
duckdb = { package = "duckdb", version = "=1.10504.0", default-features = false, features = ["serde_json"] }
dunce = "1.0.4"
env_logger = "0.11.3"
filetime = "0.2.22"
flate2 = { version = "1.1.0", default-features = false, features = ["zlib-ng"] }
fs_extra = "1.3.0"
futures = "0.3.28"
futures-util = "0.3.28"
glob = "0.3.1"
glob-match = "0.2.1"
heed = "0.22.1"
hex = "0.4.3"
http = "1.1.0"
humantime = "2.1.0"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ignore = "0.4.20"
image = "0.25.2"
indicatif = "0.18"
infer = "0.22"
itertools = "0.15"
# 11.0 ships no crypto backend by default and panics on the first encode without one.
# rust_crypto keeps the JWT path pure Rust, adding no C toolchain to the container build.
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
jwalk = "0.9"
lazy_static = "1.4.0"
libc = "0.2"
libduckdb-sys = { version = "=1.10504.0" }
# liboxen's `version` is kept in lockstep with `[workspace.package].version` by `bin/bump-version`.
# `path` is used for local builds; `version` is used by `cargo publish` so oxen-cli and oxen-server
# resolve liboxen from crates.io when published.
liboxen = { path = "crates/liboxen", version = "=0.56.0" }
lofty = "0.25"
log = "0.4.33"
lru = "0.18"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
mime = "0.3.17"
minus = { version = "5.4.0", features = ["static_output", "search"] }
mockito = "1.1.0"
mp4 = "0.14.0"
num_cpus = "1.16.0"
opentelemetry = "0.32"
# The OTLP/HTTP encoding is chosen by this feature list, not at runtime. Binary protobuf comes
# from the default "http-proto"; adding "http-json" back would make JSON the exporter's default
# encoding, which is why the builder names its encoding instead of inheriting it.
#
# "tls-roots" supplies the platform trust store that `ClientTlsConfig::with_native_roots()` reads,
# and "tls-ring" supplies the crypto provider it runs on. Without a provider feature the gRPC
# exporter refuses to build for an `https://` endpoint, which disables export.
opentelemetry-otlp = { version = "0.32", features = [
    "grpc-tonic",
    "gzip-http",
    "gzip-tonic",
    "tls-ring",
    "tls-roots",
    "trace",
] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
os_path = "0.8.0"
page_size = "0.6.0"
par-stream = { version = "0.10.2", features = ["runtime-tokio"] }
parking_lot = "0.12.1"
pathdiff = "0.2.3"
percent-encoding = "2.1"
polars = { version = "0.49.0", features = ["lazy", "parquet", "json", "ipc", "ipc_streaming", "dtype-full", "timezones", "random", "cloud", "aws"] }
pyo3 = { version = "0.25", features = ["abi3-py311"] }
pyo3-async-runtimes = { version = "0.25", features = ["attributes", "tokio-runtime"] }
pyo3-polars = { version = "0.22", features = ["dtype-full"] }
qsv-sniffer = "0.12"
rand = "0.10"
rayon = "1.8.0"
regex = "1.10.2"
reqwest = { version = "0.13.2", features = ["multipart", "json", "gzip", "stream", "query"] }
rmp-serde = "1.3.0"
rocksdb = { version = "0.22.0", default-features = false, features = ["lz4", "snappy", "multi-threaded-cf"] }
s3s = "0.14"
s3s-fs = "0.14"
sanitize-filename = "0.6.0"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }
sentry-actix = "0.49"
serde = { version = "1.0.188", features = ["derive"] }
serde_derive = "1.0.188"
serde_json = "1.0.106"
serde_with = "3.13.0"
serial_test = "4.0"
sha2 = "0.11"
signal-hook = "0.4"
simdutf8 = "0.1.4"
sql_query_builder = { version = "2.1.0", features = ["postgresql"] }
sqlparser = { version = "0.53.0", features = ["visitor"] }
strum = { version = "0.28", features = ["derive"] }
sysinfo = "0.39"
tar = "0.4.44"
tempfile = "3.8.0"
thiserror = "2.0.18"
time = { version = "0.3.55", features = ["serde", "formatting"] }
tokio = { version = "1.32.0", features = ["full", "tracing"] }
tokio-console = "0.1.13"
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.8", features = ["compat", "io", "io-util"] }
toml = "1.1"
tracing = "0.1"
# `emit_event_on_error` (the crate's only default feature) is off; oxen-server reports every
# failed request itself. See docs/error_handling.md.
tracing-actix-web = { version = "0.7", default-features = false }
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-opentelemetry = "0.33"
# "tracing-log" installs the log->tracing bridge, without which none of the `log::*` call sites
# reach a subscriber layer. It is also a default feature; listed explicitly so turning defaults off
# cannot silently unhook every error report.
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "registry", "tracing-log"] }
url = "2.4.1"
urlencoding = "2.1.3"
utoipa = { version = "5", features = ["time", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
video-rs = { version = "0.11", features = ["ndarray"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.7", features = ["xxh3"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.dev]
debug = "limited"

[profile.dev.package."*"]
debug = false
strip = "symbols"
debug-assertions = false

[profile.release]
codegen-units = 1
# The Windows release and the oxen-server image build both override this to "thin"
# through CARGO_PROFILE_RELEASE_LTO to save on build time
lto = true
opt-level = "s"
strip = true

[profile.profiling]
inherits = "release"
debug = true
# Undo `strip = true` from `release` so debug info actually reaches the binary.
strip = "none"

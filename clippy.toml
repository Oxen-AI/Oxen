# Per-lint configuration for clippy. Applies workspace-wide.
# See https://doc.rust-lang.org/clippy/lint_configuration.html

disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "Use `liboxen::util::fs::canonicalize` — it falls back to `std::path::absolute` on filesystems that don't support canonicalization (e.g. Windows imdisk ramdisks used in the test suite)." },
    { path = "std::path::Path::canonicalize", reason = "Use `liboxen::util::fs::canonicalize` — it falls back to `std::path::absolute` on filesystems that don't support canonicalization (e.g. Windows imdisk ramdisks used in the test suite)." },

    { path = "duckdb::Connection::open", reason = "Open DuckDB connections via `df_db::open_duckdb_connection` so connection-level configuration is applied in one place." },
    { path = "duckdb::Connection::open_with_flags", reason = "Open DuckDB connections via `df_db::open_duckdb_connection` or `df_db::open_hardened_query_connection` so connection-level config (the thread cap, and for hardened connections external access off, extensions off, locked) stays in one place." },

    # Spawning off the calling task without the caller's context: the request's tracing span and its Sentry hub.
    { path = "tokio::task::spawn_blocking", reason = "Use the crate's `tasks::spawn_blocking` (`liboxen::tasks` in liboxen, `crate::tasks` in oxen-server), which carries the caller's tracing span and Sentry hub onto the blocking pool." },
    { path = "tokio::spawn", reason = "Use the crate's `tasks::spawn`, which carries the caller's tracing span and Sentry hub onto the task. A task in oxen-server that outlives its request on purpose uses `crate::tasks::spawn_detached`." },
    { path = "actix_web::web::block", reason = "Use `crate::tasks::spawn_blocking`: `web::block` loses the request's context and discards a panic's message." },

    # Area averaging in one step: each output pixel's block of source pixels is summed in a `u32`, which a large shrink overflows.
    { path = "image::DynamicImage::thumbnail", reason = "Use `fit_within_box` in `repositories::versions::previews`, which shrinks in steps small enough that the sums cannot overflow." },
    { path = "image::DynamicImage::thumbnail_exact", reason = "Use `shrink_to` in `repositories::versions::previews`, which shrinks in steps small enough that the sums cannot overflow." },
    { path = "image::imageops::thumbnail", reason = "Use `shrink_to` in `repositories::versions::previews`, which shrinks in steps small enough that the sums cannot overflow." },

    # Non-atomic filesystem writes — production code must use `AtomicFile` # (`crates/liboxen/src/util/fs.rs`) so a crash
    # mid-write can never leave a torn or partially-written file. Commented out until the existing violations are migrated.
    # Uncomment once `cargo clippy --workspace --all-targets --no-deps -- -D warnings` passes with these enabled.
    # { path = "std::fs::write", reason = "Use `AtomicFile` (`crates/liboxen/src/util/fs.rs`) for atomic publishes." },
    # { path = "tokio::fs::write", reason = "Use `AtomicFile` (`crates/liboxen/src/util/fs.rs`) for atomic publishes." },
    # { path = "std::fs::File::create", reason = "Use `AtomicFile` (`crates/liboxen/src/util/fs.rs`) for atomic publishes." },
    # { path = "tokio::fs::File::create", reason = "Use `AtomicFile` (`crates/liboxen/src/util/fs.rs`) for atomic publishes." },
]
